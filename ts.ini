# File: ts.ini
# This is a configuration file for docker container johnkarpn/torrserver.
# It is created in the "../db" directory on the first start.
# Uncomment the desired options and restart the container.
#
# Priority: docker environment variables (e.g. Unraid template) > ts.ini > defaults.
# Empty environment variables are ignored, use "none" to disable BIP_URL or cron_task from env.

# Which version of the TorrServer to use. Possible options: "latest", "MatriX.141", "MatriX.147"...
# Default: "latest".
# TS_RELEASE="latest"

# Server port. Default: "8090"
# TS_PORT="8090"

# Additional options. Default: empty (no options)
# Option examples:
# -r - start in read-only DB mode
# -a - http auth on all requests
#
# To enable authentication:
# 1) Uncomment and set TS_OPTIONS="-a"
# 2) Set login/password in ../db/accs.db
# 3) Restart container
#
# TS_OPTIONS="-a -r"

# Update or not current version TorrServer to the version specified in TS_RELEASE. Default: "true"
# TS_UPDATE="true"

# Update or not OS Linux packages at start. Slows down the start,
# the image is rebuilt weekly with fresh packages anyway. Default: "false"
# LINUX_UPDATE="false"

# User and group to run TorrServer as. Unraid: PUID="99", PGID="100". Default: "0" (root)
# PUID="99"
# PGID="100"

# Source for the peers blocklist auto-update. A blocklist is third-party list of peer addresses to block.
# This can be used to block peers whose addresses are believed to belong to companies which anti-p2p activity has been seen from.
# It is converted to "../db/blocklist" file (PeerGuardian format), which TorrServer reads at start.
# Supported formats: eMule ipfilter.dat, p2p, plain text (zip, gz or uncompressed). Default: empty (not updated).
BIP_URL="https://upd.emule-security.org/ipfilter.zip"
# or
# BIP_URL="https://github.com/Naunter/BT_BlockLists/raw/master/bt_blocklists.gz"

# Cron task to automatically update TorrServer and blacklist IP. Default: empty (no auto-updates).
# Example: run update tasks every day at 4:20 a.m.:
cron_task="20 4 * * *"
